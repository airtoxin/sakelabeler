name: Supabase Keepalive

on:
  schedule:
    - cron: "0 0 */3 * *" # 3日ごとにUTC 0:00に実行
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
          NAME=$(echo "$BODY" | jq -r '.name // "unknown"')

          echo "Project: $NAME"
          echo "Status: $STATUS"
          echo "HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Supabase API request failed with status $HTTP_CODE"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
